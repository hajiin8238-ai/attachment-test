  const ATTACHMENT_DESCRIPTIONS = [{"name": "안정형", "sections": [{"kind": "paragraph", "text": "핵심 키워드: 신뢰, 정서적 안정, 친밀감, 독립성, 유연한 갈등 해결안정형 애착은 자신이 타인에게 사랑받고 지지받을 수 있다고 비교적 긍정적으로 기대하며, 타인과 가까워지는 것과 독립적으로 생활하는 것을 모두 편안하게 받아들이는 경향입니다.관계에 문제가 생기더라도 곧바로 이별이나 거절을 예상하기보다는 상황을 파악하고 해결책을 찾으려 합니다."}, {"kind": "heading", "text": "심리적 특징"}, {"kind": "paragraph", "text": "- 자기 인식: 자신의 감정과 욕구를 표현해도 괜찮다고 생각하며, 타인의 평가에 따라 자기 가치가 크게 흔들리지 않는 편입니다."}, {"kind": "paragraph", "text": "- 타인 인식: 다른 사람을 대체로 신뢰하지만, 무조건 모든 사람을 믿거나 상대방의 잘못을 무조건 용서하는 것은 아닙니다."}, {"kind": "paragraph", "text": "- 감정 조절: 불안이나 서운함을 느끼더라도 감정에 압도되지 않고, 자신의 감정을 이해하고 조절하려고 합니다."}, {"kind": "paragraph", "text": "- 친밀감: 사랑받고 싶다는 욕구를 자연스럽게 인정하며, 상대방에게 의지하는 것과 혼자 문제를 해결하는 것 사이에서 유연하게 대처합니다."}, {"kind": "paragraph", "text": "- 자율성: 연인과 함께하는 시간뿐 아니라 자신의 친구, 취미, 학업, 직업도 중요하게 여깁니다."}, {"kind": "heading", "text": "갈등을 해결하는 방식"}, {"kind": "paragraph", "text": "안정형의 핵심은 갈등이 전혀 없다는 것이 아니라, 갈등이 생겨도 관계를 안전하게 회복할 수 있다는 기대입니다.예를 들어 연인이 약속을 취소했을 때 “나를 중요하게 생각하지 않는구나”라고 즉시 단정하기보다는, 취소 이유를 확인하고 반복되는 문제라면 자신의 서운함과 기대를 전달할 수 있습니다."}, {"kind": "heading", "text": "강점과 주의할 점"}, {"kind": "paragraph", "text": "- 강점: 감정 조절, 신뢰 형성, 솔직한 의사소통, 독립성과 친밀감의 균형."}, {"kind": "paragraph", "text": "- 주의할 점: 안정형이라고 해서 늘 성숙하거나 갈등을 잘 해결하는 것은 아닙니다. 스트레스가 심하거나 신뢰가 깨진 관계에서는 안정적인 사람도 불안하거나 회피적으로 반응할 수 있습니다."}, {"kind": "heading", "text": "안정적인 관계를 유지하는 방법"}, {"kind": "paragraph", "text": "자신의 감정을 계속 살펴보고, 상대방에게 필요한 것을 명확하게 표현하며, 관계 안에서 서로의 경계와 독립성을 존중하는 것이 중요합니다."}]}, {"name": "불안-몰입형", "sections": [{"kind": "paragraph", "text": "핵심 키워드: 거절에 대한 민감성, 애정 확인, 관계 불확실성, 버림받을까 하는 두려움불안형 애착은 친밀한 관계를 중요하게 여기고 애정을 강하게 원하지만, 상대방이 자신을 충분히 사랑하지 않거나 관계를 떠날 수 있다는 걱정을 비교적 자주 경험하는 경향입니다.상대방의 말투, 연락 빈도, 표정 등 관계의 작은 변화에도 의미를 부여하고, 관계가 안전한지 확인하려는 행동이 나타날 수 있습니다."}, {"kind": "heading", "text": "심리적 특징"}, {"kind": "paragraph", "text": "- 자기 인식: 자신이 충분히 사랑받을 만한 사람인지 의심하거나, 상대방의 애정을 통해 자신의 가치를 확인하려 할 수 있습니다."}, {"kind": "paragraph", "text": "- 타인 인식: 상대방이 자신을 떠나거나 애정을 거둘 가능성에 민감합니다. 상대방의 마음이 변할 수 있다고 예상하기도 합니다."}, {"kind": "paragraph", "text": "- 감정 조절: 불확실한 상황에서 불안, 서운함, 질투, 두려움이 빠르게 커질 수 있습니다."}, {"kind": "paragraph", "text": "- 친밀감: 상대방과 자주 연락하고 많은 시간을 보내며 애정을 확인하는 것을 편안하게 느낄 수 있습니다."}, {"kind": "paragraph", "text": "- 거절 민감성: 실제로 거절당하지 않았더라도 상대방의 행동을 거절의 신호로 해석할 수 있습니다.여기서 중요한 개념은 “과잉 활성화 전략(hyperactivating strategies)”입니다. 이는 애착 대상이 멀어질 가능성을 느낄 때 관심과 위안을 얻기 위해 애착 관련 감정과 행동이 강해지는 경향을 말합니다.예를 들어 연락이 늦어지면 메시지를 반복해서 확인하거나, 상대방의 애정을 여러 번 확인하거나, 상대방이 자신을 얼마나 중요하게 생각하는지 시험하려 할 수 있습니다."}, {"kind": "heading", "text": "불안형이 관계에서 겪는 어려움"}, {"kind": "paragraph", "text": "불안형은 애정이 부족해서 문제가 생기는 것이 아닙니다. 오히려 관계를 매우 중요하게 생각하기 때문에 관계의 불확실성을 견디기 어려울 수 있습니다.상대방이 확신을 주면 잠시 안정되지만, 불확실한 상황이 다시 생기면 불안이 반복될 수 있습니다. 반대로 상대방이 실제로 무관심하거나 약속을 반복해서 어기는 경우에는 불안이 관계의 현실적인 문제를 반영할 수도 있습니다.따라서 불안형의 반응을 무조건 과민하다고 판단해서는 안 됩니다. 자신의 해석과 실제 상대방의 행동을 함께 살펴야 합니다."}, {"kind": "heading", "text": "강점과 주의할 점"}, {"kind": "paragraph", "text": "- 강점: 친밀감과 정서적 연결을 중요하게 여기며, 관계의 변화에 민감하고 애정을 적극적으로 표현할 수 있습니다."}, {"kind": "paragraph", "text": "- 주의할 점: 불확실성을 견디기 어려워 상대방의 반응을 과도하게 확인하거나, 상대방의 행동을 자신에 대한 평가로 받아들일 수 있습니다."}, {"kind": "heading", "text": "건강한 관계를 위한 방법"}, {"kind": "paragraph", "text": "1. 사실과 추측을 구분합니다. “답장이 늦었다”는 사실과 “나를 싫어한다”는 해석은 다릅니다."}, {"kind": "paragraph", "text": "2. 불안이 강해졌을 때 즉시 행동하기보다 감정을 가라앉힐 시간을 확보합니다."}, {"kind": "paragraph", "text": "3. 애정 확인을 반복하는 대신 원하는 행동을 구체적으로 요청합니다."}, {"kind": "paragraph", "text": "4. 상대방의 반응뿐 아니라 자신의 일상, 가치, 인간관계에서도 안정감을 형성합니다."}, {"kind": "paragraph", "text": "5. 상대방이 실제로 존중과 신뢰를 제공하는 사람인지도 함께 평가합니다."}]}, {"name": "거부-회피형", "sections": [{"kind": "paragraph", "text": "핵심 키워드: 독립성, 감정 억제, 의존에 대한 불편함, 거리 두기, 자기 의존회피형 애착은 타인과 정서적으로 가까워지거나 다른 사람에게 의지하는 상황을 불편하게 느끼는 경향입니다. 특히 성인 애착의 4유형 모델에서 회피형은 흔히 거부·무시형(dismissing attachment)을 가리킵니다.이 유형은 자신의 독립성과 자율성을 중요하게 여기며, 관계에서 감정적인 의존을 최소화하려 할 수 있습니다. 겉으로는 침착하고 혼자서도 잘 지내는 것처럼 보이지만, 친밀감이 강해질 때 불편함을 경험하기도 합니다."}, {"kind": "heading", "text": "심리적 특징"}, {"kind": "paragraph", "text": "- 자기 인식: 자신을 독립적이고 스스로 문제를 해결할 수 있는 사람으로 인식하는 경향이 있습니다. 타인에게 도움을 요청하는 것을 약함이나 불필요한 의존으로 받아들일 수도 있습니다."}, {"kind": "paragraph", "text": "- 타인 인식: 다른 사람이 자신의 문제를 이해하거나 적절하게 도와줄 것이라는 기대가 낮을 수 있습니다. 타인에게 지나치게 의존하면 실망하거나 통제당할 수 있다고 생각하기도 합니다."}, {"kind": "paragraph", "text": "- 감정 조절: 불편한 감정이 생기면 감정을 깊이 들여다보기보다 억제하거나, 일에 집중하거나, 혼자 시간을 보내면서 감정과 거리를 두려 할 수 있습니다."}, {"kind": "paragraph", "text": "- 친밀감: 친해지는 것 자체가 싫다기보다는 자신의 사생활과 자율성이 침해되거나 감정적으로 지나치게 의존하게 되는 상황을 부담스러워할 수 있습니다."}, {"kind": "paragraph", "text": "- 도움 요청: 어려움을 겪어도 혼자 해결하려는 경향이 있으며, 자신의 취약함을 다른 사람에게 보여 주는 것을 꺼릴 수 있습니다.이와 관련된 개념이 비활성화 전략(deactivating strategies)입니다. 애착과 관련된 감정이나 도움을 구하려는 욕구를 억제하거나 중요하지 않은 것으로 취급해 정서적 부담을 줄이려는 방식입니다. 다만 감정을 겉으로 드러내지 않는다고 해서 실제 스트레스까지 없는 것은 아닙니다. (예 : 잠자기, 잠수, 신경 끄기)"}, {"kind": "heading", "text": "회피형이 관계에서 겪는 어려움"}, {"kind": "paragraph", "text": "회피형은 갈등이나 감정적 부담이 생겼을 때 상대방과 거리를 두면서 긴장을 낮추려 할 수 있습니다. 하지만 상대방에게는 이러한 행동이 무관심이나 거절로 느껴질 수 있습니다.예를 들어 연인이 “그때 네가 한 말 때문에 서운했어”라고 이야기했을 때, 회피형 경향이 강한 사람은 자신의 감정을 설명하거나 상대방의 감정을 듣기보다 “그런 걸 왜 그렇게까지 생각해?”라고 반응하거나 대화를 중단할 수 있습니다.이때 거리를 두는 행동은 본인에게는 감정적 부담을 줄이는 방법일 수 있지만, 상대방은 자신의 감정이 무시당했다고 느낄 수 있습니다.반대로 상대방이 감정적으로 압박하거나 경계를 존중하지 않는다면 거리를 두는 행동은 자신을 보호하는 데 필요할 수도 있습니다. 그러므로 거리 두기 자체보다 그 이유, 빈도, 관계에 미치는 영향을 함께 살펴야 합니다."}, {"kind": "heading", "text": "강점과 주의할 점"}, {"kind": "paragraph", "text": "- 강점: 자율성, 독립적인 문제 해결, 개인의 경계와 사생활을 중요하게 여기는 태도."}, {"kind": "paragraph", "text": "- 주의할 점: 자신의 감정이나 도움이 필요한 순간을 지나치게 축소할 수 있고, 관계 문제를 혼자 해결하려다 상대방과의 소통이 단절될 수 있습니다."}, {"kind": "heading", "text": "건강한 관계를 위한 방법"}, {"kind": "paragraph", "text": "1. 감정적인 대화가 부담스럽더라도 상대방의 말을 즉시 차단하지 않고 끝까지 들어 봅니다."}, {"kind": "paragraph", "text": "2. 혼자 생각할 시간이 필요하면 이유와 대화 재개 시점을 함께 전달합니다. 예를 들어 “지금은 감정이 복잡해서 한 시간 정도 생각하고 저녁에 다시 이야기하고 싶어”라고 표현할 수 있습니다."}, {"kind": "paragraph", "text": "3. 감정을 표현하는 일을 약함으로 판단하지 않고, 자신의 상태를 구체적인 언어로 설명하는 연습을 합니다."}, {"kind": "paragraph", "text": "4. 모든 일을 혼자 해결하려 하기보다 신뢰할 수 있는 사람에게 작은 도움을 요청해 봅니다."}, {"kind": "paragraph", "text": "5. 상대방의 친밀감 욕구와 자신의 독립성 욕구를 모두 존중할 수 있는 관계 규칙을 만듭니다."}]}, {"name": "두려움-회피형", "sections": [{"kind": "paragraph", "text": "핵심 키워드: 친밀감에 대한 욕구와 두려움, 거절에 대한 민감성, 신뢰의 어려움, 접근과 회피의 갈등, 공포 회피형 애착은 다른 사람과 가까워지고 싶어 하면서도, 가까워지는 과정에서 거절당하거나 상처받을 가능성을 두려워하는 경향입니다.성인 애착의 4유형 모델에서는 불안과 회피가 모두 높은 유형으로 설명됩니다. 타인의 사랑과 지지를 원하지만, 동시에 타인을 완전히 신뢰하거나 자신을 드러내는 것이 어려울 수 있습니다."}, {"kind": "heading", "text": "심리적 특징"}, {"kind": "paragraph", "text": "- 자기 인식: 자신이 사랑받을 만한 사람인지 확신하기 어려울 수 있습니다. 다른 사람이 자신을 좋아하더라도 언젠가 실망하거나 떠날 것이라고 예상할 수 있습니다."}, {"kind": "paragraph", "text": "- 타인 인식: 타인의 애정과 지지를 원하지만, 타인이 자신에게 상처를 줄 가능성도 크게 느낄 수 있습니다."}, {"kind": "paragraph", "text": "- 감정 조절: 친밀감을 원하면서도 두려움을 느끼기 때문에 감정이 복잡해질 수 있습니다. 가까워지려는 행동과 물러서려는 행동이 함께 나타나기도 합니다."}, {"kind": "paragraph", "text": "- 친밀감: 혼자 있는 것이 외롭지만, 누군가에게 마음을 열면 자신의 약점이 드러나거나 거절당할까 봐 걱정할 수 있습니다."}, {"kind": "paragraph", "text": "- 신뢰: 상대방이 애정을 표현하더라도 이를 편안하게 받아들이기 어렵거나, 상대방의 진심을 반복해서 의심할 수 있습니다.공포회피형은 불안형과 회피형의 특징이 단순히 반씩 섞인 유형이라고만 볼 수는 없습니다. 핵심은 관계를 향한 접근 욕구와 관계에서 자신을 보호하려는 회피 욕구가 동시에 강하게 나타날 수 있다는 점입니다."}, {"kind": "heading", "text": "공포회피형의 내면에서 나타날 수 있는 갈등"}, {"kind": "paragraph", "text": "공포회피형을 이해할 때 중요한 것은 겉으로 보이는 행동만으로 그 사람의 마음을 판단하지 않는 것입니다.예를 들어 상대방이 자신에게 다정하게 다가올 때 다음과 같은 상반된 생각이 동시에 나타날 수 있습니다."}, {"kind": "paragraph", "text": "- “이 사람과 더 가까워지고 싶어.”"}, {"kind": "paragraph", "text": "- “하지만 가까워졌다가 상처받으면 어떡하지?”"}, {"kind": "paragraph", "text": "- “나를 정말 좋아하는 게 맞을까?”"}, {"kind": "paragraph", "text": "- “너무 깊어지기 전에 거리를 두는 편이 안전하지 않을까?”이러한 갈등은 친밀감을 원하지 않아서가 아니라, 친밀감이 주는 기대와 상처의 가능성을 동시에 크게 느끼기 때문에 나타날 수 있습니다.다만 실제로 관계를 시작했다가 마음이 바뀌거나, 혼자 있고 싶어지는 행동이 나타났다고 해서 반드시 공포회피형인 것은 아닙니다. 관계가 건강하지 않거나 상대방을 충분히 신뢰하지 못하는 현실적인 이유도 살펴야 합니다."}, {"kind": "heading", "text": "공포 회피형이 관계에서 겪는 어려움"}, {"kind": "paragraph", "text": "공포 회피형은 친밀감이 필요할 때도 자신을 보호하기 위해 감정을 억제하거나 관계에서 물러날 수 있습니다. 그러나 거리를 둔 뒤에는 외로움이나 상실감을 느낄 수도 있습니다.이런 상반된 반응이 반복되면 본인도 자신의 마음을 이해하기 어려워지고, 상대방 역시 어느 정도 가까워져도 되는지 혼란스러울 수 있습니다.애착 표상과 감정 조절을 다룬 연구에서는 해결되지 않은 애착 관련 경험이 정서적 위협에 대처하는 데 어려움과 연관될 수 있다고 보고합니다. 다만 이러한 연구 결과만으로 특정 개인의 행동 원인이나 과거 경험을 단정해서는 안 됩니다."}, {"kind": "heading", "text": "강점과 주의할 점"}, {"kind": "paragraph", "text": "- 강점: 관계에 대한 기대와 두려움을 성찰하고, 자신에게 안전한 관계 조건을 이해한다면 깊이 있는 자기이해와 신중한 관계 형성으로 이어질 수 있습니다."}, {"kind": "paragraph", "text": "- 주의할 점: 상처를 피하려는 마음 때문에 신뢰할 수 있는 사람에게도 지나치게 거리를 두거나, 반대로 불안할 때 관계를 급하게 붙잡는 등 일관되지 않은 대처가 나타날 수 있습니다.여기서 주의할 것은 공포회피형이라는 이름만으로 그 사람이 반드시 트라우마를 겪었거나 어린 시절 학대를 경험했다고 판단해서는 안 된다는 것입니다. 애착에는 다양한 경험과 개인적 요인이 관여합니다."}, {"kind": "heading", "text": "건강한 관계를 위한 방법"}, {"kind": "paragraph", "text": "1. 친밀감을 느낄 때 생기는 두려움을 억지로 없애기보다 먼저 알아차립니다."}, {"kind": "paragraph", "text": "2. 상대방을 전적으로 신뢰하거나 완전히 차단하는 양극단 대신, 작은 약속과 행동을 통해 신뢰를 점진적으로 확인합니다."}, {"kind": "paragraph", "text": "3. 마음이 불안할 때 즉시 관계를 끊거나 상대방을 시험하기보다, 잠시 멈추고 자신이 두려워하는 것이 무엇인지 기록합니다."}, {"kind": "paragraph", "text": "4. 상대방에게 필요한 거리와 친밀감의 정도를 구체적으로 설명합니다."}, {"kind": "paragraph", "text": "5. 관계 패턴으로 인해 고통이 지속되거나 일상생활에 지장이 있다면 상담 전문가와 함께 자신의 경험과 감정 조절 방식을 탐색할 수 있습니다."}]}];

function steps(n){return `<div class="eyebrow">${week}주차 · ${esc(DATA[week].title)}</div><div class="steps" aria-label="진행 단계">${['테스트','결과 확인','결과 기반 활동'].map((t,i)=>`<span ${n===i?'class="current" aria-current="step"':''}>${i+1}. ${t}</span>`).join('')}</div>`;}
function valid(w){return STATES[w].responses.every(n=>Number.isInteger(n)&&n>=1&&n<=DATA[w].max);}
function calculate(w,answers=STATES[w].responses){
 const d=DATA[w];if(answers.length!==d.questions.length||answers.some(n=>!Number.isInteger(n)||n<1||n>d.max))throw Error('모든 문항에 응답해 주세요.');
 const scores=answers.map((n,i)=>d.questions[i].reverse?d.max+1-n:n);
 if(w===2){const avg=dim=>{const a=scores.filter((_,i)=>d.questions[i].dimension===dim);return a.reduce((a,b)=>a+b,0)/a.length;};const anxiety=avg('anxiety'),avoidance=avg('avoidance');return {anxiety,avoidance,typeIndex:anxiety>=4?(avoidance>=4?3:1):(avoidance>=4?2:0)};}
 const total=scores.reduce((a,b)=>a+b,0),areas=d.areas.map(a=>a.items.reduce((n,i)=>n+scores[i-1],0)/(w===4?5:1));

const APPROVED_REPORT_HTML = ["<h3>유형의 정의와 핵심 키워드</h3>\n<p>핵심 키워드: 신뢰, 정서적 안정, 친밀감, 독립성, 유연한 갈등 해결</p>\n<p>안정형 애착은 자신이 타인에게 사랑받고 지지받을 수 있다고 비교적 긍정적으로 기대하며, 타인과 가까워지는 것과 독립적으로 생활하는 것을 모두 편안하게 받아들이는 경향입니다.</p>\n<p>관계에 문제가 생기더라도 곧바로 이별이나 거절을 예상하기보다는 상황을 파악하고 해결책을 찾으려 합니다.</p>\n<h3>자기·타인에 대한 관점</h3>\n<p><strong>4유형 모형의 관점: 자기 긍정 · 타인 긍정</strong></p>\n<p>자신이 사랑받을 가치가 있다고 생각하고, 상대도 신뢰할 수 있는 존재로 인식합니다.</p>\n<p>이는 모형에서 설명하는 경향이며, 개인의 가치나 타인의 실제 신뢰성을 평가하는 판정은 아닙니다.</p>\n<h3>심리적 특징</h3>\n<p>- 자기 인식: 자신의 감정과 욕구를 표현해도 괜찮다고 생각하며, 타인의 평가에 따라 자기 가치가 크게 흔들리지 않는 편입니다.</p>\n<p>- 타인 인식: 다른 사람을 대체로 신뢰하지만, 무조건 모든 사람을 믿거나 상대방의 잘못을 무조건 용서하는 것은 아닙니다.</p>\n<p>- 감정 조절: 불안이나 서운함을 느끼더라도 감정에 압도되지 않고, 자신의 감정을 이해하고 조절하려고 합니다.</p>\n<p>- 친밀감: 사랑받고 싶다는 욕구를 자연스럽게 인정하며, 상대방에게 의지하는 것과 혼자 문제를 해결하는 것 사이에서 유연하게 대처합니다.</p>\n<p>- 자율성: 연인과 함께하는 시간뿐 아니라 자신의 친구, 취미, 학업, 직업도 중요하게 여깁니다.</p>\n<h3>연애에서 나타나는 행동</h3>\n<p>아래는 해당 경향에서 나타날 수 있는 반응입니다. 모든 상황에서 똑같이 반응한다는 뜻은 아닙니다.</p>\n<div class=\"behavior-table\"><table><thead><tr><th scope=\"col\">상황</th><th scope=\"col\">나타날 수 있는 반응</th></tr></thead><tbody>\n<tr><th scope=\"row\">연인의 답장이 늦을 때</th><td>다른 가능성을 고려하고 필요하면 직접 확인한다.</td></tr>\n<tr><th scope=\"row\">상대방과 의견이 다를 때</th><td>자신의 생각을 설명하고 상대방의 입장도 듣는다.</td></tr>\n<tr><th scope=\"row\">서운한 일이 생겼을 때</th><td>감정을 숨기거나 공격하기보다 차분하게 표현한다.</td></tr>\n<tr><th scope=\"row\">연인이 혼자만의 시간을 원할 때</th><td>이를 곧바로 사랑이 식었다는 의미로 받아들이지 않는다.</td></tr>\n<tr><th scope=\"row\">이별 가능성이 생겼을 때</th><td>관계를 회복하려 노력하되, 상대방의 의사와 자신의 한계도 존중한다.</td></tr>\n</tbody></table></div>\n<h3>갈등을 해결하는 방식</h3>\n<p>안정형의 핵심은 갈등이 전혀 없다는 것이 아니라, 갈등이 생겨도 관계를 안전하게 회복할 수 있다는 기대입니다.</p>\n<p>예를 들어 연인이 약속을 취소했을 때 “나를 중요하게 생각하지 않는구나”라고 즉시 단정하기보다는, 취소 이유를 확인하고 반복되는 문제라면 자신의 서운함과 기대를 전달할 수 있습니다.</p>\n<h3>강점과 주의할 점</h3>\n<p>- 강점: 감정 조절, 신뢰 형성, 솔직한 의사소통, 독립성과 친밀감의 균형.</p>\n<p>- 주의할 점: 안정형이라고 해서 늘 성숙하거나 갈등을 잘 해결하는 것은 아닙니다. 스트레스가 심하거나 신뢰가 깨진 관계에서는 안정적인 사람도 불안하거나 회피적으로 반응할 수 있습니다.</p>\n<h3>안정적인 관계를 유지하는 방법</h3>\n<p>자신의 감정을 계속 살펴보고, 상대방에게 필요한 것을 명확하게 표현하며, 관계 안에서 서로의 경계와 독립성을 존중하는 것이 중요합니다.</p>", "<h3>유형의 정의와 핵심 키워드</h3>\n<p>핵심 키워드: 거절에 대한 민감성, 애정 확인, 관계 불확실성, 버림받을까 하는 두려움</p>\n<p>불안형 애착은 친밀한 관계를 중요하게 여기고 애정을 강하게 원하지만, 상대방이 자신을 충분히 사랑하지 않거나 관계를 떠날 수 있다는 걱정을 비교적 자주 경험하는 경향입니다.</p>\n<p>상대방의 말투, 연락 빈도, 표정 등 관계의 작은 변화에도 의미를 부여하고, 관계가 안전한지 확인하려는 행동이 나타날 수 있습니다.</p>\n<h3>자기·타인에 대한 관점</h3>\n<p><strong>4유형 모형의 관점: 자기 부정 · 타인 긍정</strong></p>\n<p>자신이 사랑받을 가치가 있는지 의심하며, 타인의 인정과 애정을 통해 안정감을 얻으려는 경향이 있습니다.</p>\n<p>이는 모형에서 설명하는 경향이며, 개인의 가치나 타인의 실제 신뢰성을 평가하는 판정은 아닙니다.</p>\n<h3>심리적 특징</h3>\n<p>- 자기 인식: 자신이 충분히 사랑받을 만한 사람인지 의심하거나, 상대방의 애정을 통해 자신의 가치를 확인하려 할 수 있습니다.</p>\n<p>- 타인 인식: 상대방이 자신을 떠나거나 애정을 거둘 가능성에 민감합니다. 상대방의 마음이 변할 수 있다고 예상하기도 합니다.</p>\n<p>- 감정 조절: 불확실한 상황에서 불안, 서운함, 질투, 두려움이 빠르게 커질 수 있습니다.</p>\n<p>- 친밀감: 상대방과 자주 연락하고 많은 시간을 보내며 애정을 확인하는 것을 편안하게 느낄 수 있습니다.</p>\n<p>- 거절 민감성: 실제로 거절당하지 않았더라도 상대방의 행동을 거절의 신호로 해석할 수 있습니다.</p>\n<p>여기서 중요한 개념은 “과잉 활성화 전략(hyperactivating strategies)”입니다. 이는 애착 대상이 멀어질 가능성을 느낄 때 관심과 위안을 얻기 위해 애착 관련 감정과 행동이 강해지는 경향을 말합니다.</p>\n<p>예를 들어 연락이 늦어지면 메시지를 반복해서 확인하거나, 상대방의 애정을 여러 번 확인하거나, 상대방이 자신을 얼마나 중요하게 생각하는지 시험하려 할 수 있습니다.</p>\n<h3>연애에서 나타나는 행동</h3>\n<p>아래는 해당 경향에서 나타날 수 있는 반응입니다. 모든 상황에서 똑같이 반응한다는 뜻은 아닙니다.</p>\n<div class=\"behavior-table\"><table><thead><tr><th scope=\"col\">상황</th><th scope=\"col\">나타날 수 있는 반응</th></tr></thead><tbody>\n<tr><th scope=\"row\">연인의 답장이 늦을 때</th><td>마음이 식었는지 걱정하며 메시지를 반복해서 확인한다.</td></tr>\n<tr><th scope=\"row\">상대방의 애정 표현이 줄었을 때</th><td>관계가 끝날 가능성을 떠올리고 확신을 구한다.</td></tr>\n<tr><th scope=\"row\">연인이 혼자 시간을 보내려 할 때</th><td>자신보다 다른 것을 중요하게 생각한다고 느낄 수 있다.</td></tr>\n<tr><th scope=\"row\">갈등이 생겼을 때</th><td>빨리 화해하고 싶어 반복해서 연락하거나 답을 요구할 수 있다.</td></tr>\n<tr><th scope=\"row\">상대방이 이별을 언급할 때</th><td>강한 불안과 상실감을 느끼며 관계를 붙잡으려 할 수 있다.</td></tr>\n</tbody></table></div>\n<h3>불안형이 관계에서 겪는 어려움</h3>\n<p>불안형은 애정이 부족해서 문제가 생기는 것이 아닙니다. 오히려 관계를 매우 중요하게 생각하기 때문에 관계의 불확실성을 견디기 어려울 수 있습니다.</p>\n<p>상대방이 확신을 주면 잠시 안정되지만, 불확실한 상황이 다시 생기면 불안이 반복될 수 있습니다. 반대로 상대방이 실제로 무관심하거나 약속을 반복해서 어기는 경우에는 불안이 관계의 현실적인 문제를 반영할 수도 있습니다.</p>\n<p>따라서 불안형의 반응을 무조건 과민하다고 판단해서는 안 됩니다. 자신의 해석과 실제 상대방의 행동을 함께 살펴야 합니다.</p>\n<h3>강점과 주의할 점</h3>\n<p>- 강점: 친밀감과 정서적 연결을 중요하게 여기며, 관계의 변화에 민감하고 애정을 적극적으로 표현할 수 있습니다.</p>\n<p>- 주의할 점: 불확실성을 견디기 어려워 상대방의 반응을 과도하게 확인하거나, 상대방의 행동을 자신에 대한 평가로 받아들일 수 있습니다.</p>\n<h3>건강한 관계를 위한 방법</h3>\n<p>1. 사실과 추측을 구분합니다. “답장이 늦었다”는 사실과 “나를 싫어한다”는 해석은 다릅니다.</p>\n<p>2. 불안이 강해졌을 때 즉시 행동하기보다 감정을 가라앉힐 시간을 확보합니다.</p>\n<p>3. 애정 확인을 반복하는 대신 원하는 행동을 구체적으로 요청합니다.</p>\n<p>4. 상대방의 반응뿐 아니라 자신의 일상, 가치, 인간관계에서도 안정감을 형성합니다.</p>\n<p>5. 상대방이 실제로 존중과 신뢰를 제공하는 사람인지도 함께 평가합니다.</p>", "<h3>유형의 정의와 핵심 키워드</h3>\n<p>핵심 키워드: 독립성, 감정 억제, 의존에 대한 불편함, 거리 두기, 자기 의존</p>\n<p>회피형 애착은 타인과 정서적으로 가까워지거나 다른 사람에게 의지하는 상황을 불편하게 느끼는 경향입니다. 특히 성인 애착의 4유형 모델에서 회피형은 흔히 거부·무시형(dismissing attachment)을 가리킵니다.</p>\n<p>이 유형은 자신의 독립성과 자율성을 중요하게 여기며, 관계에서 감정적인 의존을 최소화하려 할 수 있습니다. 겉으로는 침착하고 혼자서도 잘 지내는 것처럼 보이지만, 친밀감이 강해질 때 불편함을 경험하기도 합니다.</p>\n<h3>자기·타인에 대한 관점</h3>\n<p><strong>4유형 모형의 관점: 자기 긍정 · 타인 부정</strong></p>\n<p>자신의 독립성을 중시하고, 타인에게 의지하는 것의 필요성과 가치를 낮게 평가할 수 있습니다.</p>\n<p>이는 모형에서 설명하는 경향이며, 개인의 가치나 타인의 실제 신뢰성을 평가하는 판정은 아닙니다.</p>\n<h3>심리적 특징</h3>\n<p>- 자기 인식: 자신을 독립적이고 스스로 문제를 해결할 수 있는 사람으로 인식하는 경향이 있습니다. 타인에게 도움을 요청하는 것을 약함이나 불필요한 의존으로 받아들일 수도 있습니다.</p>\n<p>- 타인 인식: 다른 사람이 자신의 문제를 이해하거나 적절하게 도와줄 것이라는 기대가 낮을 수 있습니다. 타인에게 지나치게 의존하면 실망하거나 통제당할 수 있다고 생각하기도 합니다.</p>\n<p>- 감정 조절: 불편한 감정이 생기면 감정을 깊이 들여다보기보다 억제하거나, 일에 집중하거나, 혼자 시간을 보내면서 감정과 거리를 두려 할 수 있습니다.</p>\n<p>- 친밀감: 친해지는 것 자체가 싫다기보다는 자신의 사생활과 자율성이 침해되거나 감정적으로 지나치게 의존하게 되는 상황을 부담스러워할 수 있습니다.</p>\n<p>- 도움 요청: 어려움을 겪어도 혼자 해결하려는 경향이 있으며, 자신의 취약함을 다른 사람에게 보여 주는 것을 꺼릴 수 있습니다.</p>\n<p>이와 관련된 개념이 비활성화 전략(deactivating strategies)입니다. 애착과 관련된 감정이나 도움을 구하려는 욕구를 억제하거나 중요하지 않은 것으로 취급해 정서적 부담을 줄이려는 방식입니다. 다만 감정을 겉으로 드러내지 않는다고 해서 실제 스트레스까지 없는 것은 아닙니다. (예 : 잠자기, 잠수, 신경 끄기)</p>\n<h3>연애에서 나타나는 행동</h3>\n<p>아래는 해당 경향에서 나타날 수 있는 반응입니다. 모든 상황에서 똑같이 반응한다는 뜻은 아닙니다.</p>\n<div class=\"behavior-table\"><table><thead><tr><th scope=\"col\">상황</th><th scope=\"col\">나타날 수 있는 반응</th></tr></thead><tbody>\n<tr><th scope=\"row\">연인이 자주 연락을 원할 때</th><td>자신의 시간과 자유가 제한된다고 느낄 수 있다.</td></tr>\n<tr><th scope=\"row\">연인이 감정적인 대화를 요청할 때</th><td>대화를 미루거나 문제를 혼자 생각하려 한다.</td></tr>\n<tr><th scope=\"row\">연인이 위로나 도움을 요청할 때</th><td>감정을 다루기보다 해결책을 제시하거나 상황을 빨리 끝내려 할 수 있다.</td></tr>\n<tr><th scope=\"row\">갈등이 생겼을 때</th><td>혼자 생각할 시간을 확보하거나 대화에서 물러날 수 있다.</td></tr>\n<tr><th scope=\"row\">관계가 매우 친밀해질 때</th><td>자신의 독립성이 줄어드는 듯한 부담을 느낄 수 있다.</td></tr>\n</tbody></table></div>\n<h3>회피형이 관계에서 겪는 어려움</h3>\n<p>회피형은 갈등이나 감정적 부담이 생겼을 때 상대방과 거리를 두면서 긴장을 낮추려 할 수 있습니다. 하지만 상대방에게는 이러한 행동이 무관심이나 거절로 느껴질 수 있습니다.</p>\n<p>예를 들어 연인이 “그때 네가 한 말 때문에 서운했어”라고 이야기했을 때, 회피형 경향이 강한 사람은 자신의 감정을 설명하거나 상대방의 감정을 듣기보다 “그런 걸 왜 그렇게까지 생각해?”라고 반응하거나 대화를 중단할 수 있습니다.</p>\n<p>이때 거리를 두는 행동은 본인에게는 감정적 부담을 줄이는 방법일 수 있지만, 상대방은 자신의 감정이 무시당했다고 느낄 수 있습니다.</p>\n<p>반대로 상대방이 감정적으로 압박하거나 경계를 존중하지 않는다면 거리를 두는 행동은 자신을 보호하는 데 필요할 수도 있습니다. 그러므로 거리 두기 자체보다 그 이유, 빈도, 관계에 미치는 영향을 함께 살펴야 합니다.</p>\n<h3>강점과 주의할 점</h3>\n<p>- 강점: 자율성, 독립적인 문제 해결, 개인의 경계와 사생활을 중요하게 여기는 태도.</p>\n<p>- 주의할 점: 자신의 감정이나 도움이 필요한 순간을 지나치게 축소할 수 있고, 관계 문제를 혼자 해결하려다 상대방과의 소통이 단절될 수 있습니다.</p>\n<h3>건강한 관계를 위한 방법</h3>\n<p>1. 감정적인 대화가 부담스럽더라도 상대방의 말을 즉시 차단하지 않고 끝까지 들어 봅니다.</p>\n<p>2. 혼자 생각할 시간이 필요하면 이유와 대화 재개 시점을 함께 전달합니다. 예를 들어 “지금은 감정이 복잡해서 한 시간 정도 생각하고 저녁에 다시 이야기하고 싶어”라고 표현할 수 있습니다.</p>\n<p>3. 감정을 표현하는 일을 약함으로 판단하지 않고, 자신의 상태를 구체적인 언어로 설명하는 연습을 합니다.</p>\n<p>4. 모든 일을 혼자 해결하려 하기보다 신뢰할 수 있는 사람에게 작은 도움을 요청해 봅니다.</p>\n<p>5. 상대방의 친밀감 욕구와 자신의 독립성 욕구를 모두 존중할 수 있는 관계 규칙을 만듭니다.</p>", "<h3>유형의 정의와 핵심 키워드</h3>\n<p>핵심 키워드: 친밀감에 대한 욕구와 두려움, 거절에 대한 민감성, 신뢰의 어려움, 접근과 회피의 갈등,</p>\n<p>공포 회피형 애착은 다른 사람과 가까워지고 싶어 하면서도, 가까워지는 과정에서 거절당하거나 상처받을 가능성을 두려워하는 경향입니다.</p>\n<p>성인 애착의 4유형 모델에서는 불안과 회피가 모두 높은 유형으로 설명됩니다. 타인의 사랑과 지지를 원하지만, 동시에 타인을 완전히 신뢰하거나 자신을 드러내는 것이 어려울 수 있습니다.</p>\n<h3>자기·타인에 대한 관점</h3>\n<p><strong>4유형 모형의 관점: 자기 부정 · 타인 부정</strong></p>\n<p>자신이 사랑받을 가치가 있는지 확신하기 어렵고, 타인도 완전히 신뢰하기 어려울 수 있습니다.</p>\n<p>이는 모형에서 설명하는 경향이며, 개인의 가치나 타인의 실제 신뢰성을 평가하는 판정은 아닙니다.</p>\n<h3>심리적 특징</h3>\n<p>- 자기 인식: 자신이 사랑받을 만한 사람인지 확신하기 어려울 수 있습니다. 다른 사람이 자신을 좋아하더라도 언젠가 실망하거나 떠날 것이라고 예상할 수 있습니다.</p>\n<p>- 타인 인식: 타인의 애정과 지지를 원하지만, 타인이 자신에게 상처를 줄 가능성도 크게 느낄 수 있습니다.</p>\n<p>- 감정 조절: 친밀감을 원하면서도 두려움을 느끼기 때문에 감정이 복잡해질 수 있습니다. 가까워지려는 행동과 물러서려는 행동이 함께 나타나기도 합니다.</p>\n<p>- 친밀감: 혼자 있는 것이 외롭지만, 누군가에게 마음을 열면 자신의 약점이 드러나거나 거절당할까 봐 걱정할 수 있습니다.</p>\n<p>- 신뢰: 상대방이 애정을 표현하더라도 이를 편안하게 받아들이기 어렵거나, 상대방의 진심을 반복해서 의심할 수 있습니다.</p>\n<p>공포회피형은 불안형과 회피형의 특징이 단순히 반씩 섞인 유형이라고만 볼 수는 없습니다. 핵심은 관계를 향한 접근 욕구와 관계에서 자신을 보호하려는 회피 욕구가 동시에 강하게 나타날 수 있다는 점입니다.</p>\n<h3>연애에서 나타나는 행동</h3>\n<p>아래는 해당 경향에서 나타날 수 있는 반응입니다. 모든 상황에서 똑같이 반응한다는 뜻은 아닙니다.</p>\n<div class=\"behavior-table\"><table><thead><tr><th scope=\"col\">상황</th><th scope=\"col\">나타날 수 있는 반응</th></tr></thead><tbody>\n<tr><th scope=\"row\">누군가 자신에게 호감을 표현할 때</th><td>기쁘면서도 상대방을 믿어도 될지 걱정한다.</td></tr>\n<tr><th scope=\"row\">상대방과 가까워질 때</th><td>친밀감을 원하지만 상처받을 가능성 때문에 거리를 두고 싶어진다.</td></tr>\n<tr><th scope=\"row\">연인이 애정을 표현할 때</th><td>사랑받는다는 안도감과 동시에 부담이나 의심을 느낄 수 있다.</td></tr>\n<tr><th scope=\"row\">갈등이 생겼을 때</th><td>상대방에게 위로를 받고 싶으면서도 자신의 감정을 드러내기 어려워할 수 있다.</td></tr>\n<tr><th scope=\"row\">관계가 불안정해질 때</th><td>상대방을 붙잡고 싶다가도 먼저 관계를 끊거나 마음을 닫고 싶어질 수 있다.</td></tr>\n</tbody></table></div>\n<h3>공포회피형의 내면에서 나타날 수 있는 갈등</h3>\n<p>공포회피형을 이해할 때 중요한 것은 겉으로 보이는 행동만으로 그 사람의 마음을 판단하지 않는 것입니다.</p>\n<p>예를 들어 상대방이 자신에게 다정하게 다가올 때 다음과 같은 상반된 생각이 동시에 나타날 수 있습니다.</p>\n<p>- “이 사람과 더 가까워지고 싶어.”</p>\n<p>- “하지만 가까워졌다가 상처받으면 어떡하지?”</p>\n<p>- “나를 정말 좋아하는 게 맞을까?”</p>\n<p>- “너무 깊어지기 전에 거리를 두는 편이 안전하지 않을까?”이러한 갈등은 친밀감을 원하지 않아서가 아니라, 친밀감이 주는 기대와 상처의 가능성을 동시에 크게 느끼기 때문에 나타날 수 있습니다.</p>\n<p>다만 실제로 관계를 시작했다가 마음이 바뀌거나, 혼자 있고 싶어지는 행동이 나타났다고 해서 반드시 공포회피형인 것은 아닙니다. 관계가 건강하지 않거나 상대방을 충분히 신뢰하지 못하는 현실적인 이유도 살펴야 합니다.</p>\n<h3>공포 회피형이 관계에서 겪는 어려움</h3>\n<p>공포 회피형은 친밀감이 필요할 때도 자신을 보호하기 위해 감정을 억제하거나 관계에서 물러날 수 있습니다. 그러나 거리를 둔 뒤에는 외로움이나 상실감을 느낄 수도 있습니다.</p>\n<p>이런 상반된 반응이 반복되면 본인도 자신의 마음을 이해하기 어려워지고, 상대방 역시 어느 정도 가까워져도 되는지 혼란스러울 수 있습니다.</p>\n<p>애착 표상과 감정 조절을 다룬 연구에서는 해결되지 않은 애착 관련 경험이 정서적 위협에 대처하는 데 어려움과 연관될 수 있다고 보고합니다. 다만 이러한 연구 결과만으로 특정 개인의 행동 원인이나 과거 경험을 단정해서는 안 됩니다.</p>\n<h3>강점과 주의할 점</h3>\n<p>- 강점: 관계에 대한 기대와 두려움을 성찰하고, 자신에게 안전한 관계 조건을 이해한다면 깊이 있는 자기이해와 신중한 관계 형성으로 이어질 수 있습니다.</p>\n<p>- 주의할 점: 상처를 피하려는 마음 때문에 신뢰할 수 있는 사람에게도 지나치게 거리를 두거나, 반대로 불안할 때 관계를 급하게 붙잡는 등 일관되지 않은 대처가 나타날 수 있습니다.</p>\n<p>여기서 주의할 것은 공포회피형이라는 이름만으로 그 사람이 반드시 트라우마를 겪었거나 어린 시절 학대를 경험했다고 판단해서는 안 된다는 것입니다. 애착에는 다양한 경험과 개인적 요인이 관여합니다.</p>\n<h3>건강한 관계를 위한 방법</h3>\n<p>1. 친밀감을 느낄 때 생기는 두려움을 억지로 없애기보다 먼저 알아차립니다.</p>\n<p>2. 상대방을 전적으로 신뢰하거나 완전히 차단하는 양극단 대신, 작은 약속과 행동을 통해 신뢰를 점진적으로 확인합니다.</p>\n<p>3. 마음이 불안할 때 즉시 관계를 끊거나 상대방을 시험하기보다, 잠시 멈추고 자신이 두려워하는 것이 무엇인지 기록합니다.</p>\n<p>4. 상대방에게 필요한 거리와 친밀감의 정도를 구체적으로 설명합니다.</p>\n<p>5. 관계 패턴으로 인해 고통이 지속되거나 일상생활에 지장이 있다면 상담 전문가와 함께 자신의 경험과 감정 조절 방식을 탐색할 수 있습니다.</p>"];

function introOne(){return `<div class="eyebrow">RELATIONSHIP PREP / WEEK 01</div><p class="small">자기수용 · 자존감 워크지 · 1<br>RELATIONSHIP PREP · SELF-ACCEPTANCE</p><h1>나를 받아들이는 연습</h1><p>자존감과 자기수용 | 1주차 프로그램 워크지</p><h3>오늘의 질문</h3><p>나는 사랑하는 사람에게 좋은 사람으로 보이기 위해, 나의 어떤 모습을 숨기고 있을까?</p><h3>오늘 함께 살펴볼 것</h3><ul><li>자존감, 자기수용, 자기효능감의 차이를 이해한다.</li><li>테스트를 통해 내가 나 자신을 바라보는 태도를 점검한다.</li><li>나의 반응이 연애와 결혼 관계에서 어떻게 나타나는지 살펴본다.</li><li>나를 존중하는 작은 실천 한 가지를 정한다.</li></ul><h3>핵심 개념 한눈에 보기</h3><div class="concept-grid"><div><b>자존감</b><p>나는 가치 있고 존중받을 만한 사람인가?</p></div><div><b>자기수용</b><p>나의 강점과 약점, 감정과 한계를 인정하는가?</p></div><div><b>자기효능감</b><p>나는 특정한 일을 해낼 수 있다고 믿는가?</p></div></div><h3>시작하며</h3><p>연애와 결혼을 준비할 때 상대방을 이해하는 것만큼 나 자신을 이해하는 것도 중요하다. 자기수용은 자신의 모든 행동이 옳다고 여기는 것이 아니라, 부족함을 인정하면서도 자신의 존재 전체를 부정하지 않는 태도이다.</p><div class="notice">※ 이 워크지는 자기성찰을 위한 자료입니다. 점수는 나의 가치나 관계 준비도를 판정하지 않으며, 답변과 경험을 다른 사람에게 공개할 필요는 없습니다.</div>`;}
function introFour(){return `<h1>나를 대하는 나의 태도 — 자기연민 검사</h1><p>자기연민은 힘든 순간에 자신을 비난하거나 외면하기보다, 자신의 고통을 이해하고 따뜻하게 대하는 태도입니다.</p><p>이 검사는 내가 힘든 상황에서 자신을 어떻게 대하는지 살펴보고, 자기돌봄과 감정 이해를 위해 어떤 연습이 필요한지 알아보기 위한 자기이해용 검사입니다.</p><div class="notice"><p>예상 소요 시간: 약 3~5분<br>문항 수: 15문항<br>검사 결과: 자기돌봄 · 보편적 인간성 · 마음챙김<br>결과 활용: 자신의 강점 이해, 성장 방향 확인, 일상에서 실천할 방법 찾기</p></div><h3>응답 방법</h3><p>각 문항을 읽고 평소 자신의 모습에 얼마나 가까운지 선택해 주세요.</p><ul>${DATA[4].labels.map((t,i)=>`<li>${i+1}점: ${esc(t)}</li>`).join('')}</ul><div class="notice">안내: 아래 15개 문항은 자기이해를 돕기 위한 예비 문항입니다. 정식 자기연민 척도나 임상적 진단 도구로 검증된 문항이 아니며, 점수는 참고용으로만 활용해야 합니다.</div>`;}
intro=function(){if(week===2){originalIntro();return;}screen='intro';const s=STATES[week];setView(`${steps(0)}<section class="panel">${week===1?introOne():introFour()}${week===1?notice():''}<div class="actions">${btn('start',s.responses.some(v=>v!==null)?'검사 이어가기 →':'검사 시작하기 →')}${valid(week)?btn('resumeResult','결과 확인','secondary')+btn('resumeActivity','활동 이어가기','secondary'):''}</div>${source()}</section>`);el('start').onclick=quiz;if(el('resumeResult'))el('resumeResult').onclick=result;if(el('resumeActivity'))el('resumeActivity').onclick=activity;};
function attachmentResult(r){const a=ATTACHMENT_DESCRIPTIONS[r.typeIndex];return `<div class="scoregrid">${scoreCard('애착불안',r.anxiety.toFixed(2),7,1)}${scoreCard('애착회피',r.avoidance.toFixed(2),7,1)}</div>${attachmentChart(r)}<div class="axis-definitions">${APPROVED_COMMON_HTML.slice(0,2).join('')}</div><h2 id="typeName">${esc(a.name)}</h2><div class="notice">${APPROVED_COMMON_HTML[2]}</div><section class="approved-report" aria-label="${esc(a.name)} 상세 설명">${APPROVED_REPORT_HTML[r.typeIndex]}</section><p class="source">자료: 「애착유형과 자기 이해 프로그램 조사 및 정리」 4~10쪽의 본문 및 이미지 표 · 「애착 유형」 3~6쪽. 승인된 상세 결과지 본문을 반영했습니다.</p>`;}
activity=function(){if(week===2&&STATES[2].activity===2){roleplay();return;}originalActivity();if(screen!=='activity')return;if(week===4&&STATES[4].activity===2){const ds=Array.from(app.querySelectorAll('.panel>details'));const box=document.createElement('section');box.className='result-review';box.innerHTML='<h3>나의 테스트 결과 다시 확인하기</h3><p class="small">검사 결과를 돌아본 뒤, 아래에서 나에게 필요한 문장을 골라 보세요.</p>';if(ds.length){ds[0].before(box);ds.forEach(d=>box.append(d));}}
 if(week===4&&STATES[4].activity===3){const s=STATES[4];const selected=s.answers['1-0'];const box=document.createElement('section');box.className='situation-review';box.innerHTML=`<h3>앞서 살펴본 연애 상황</h3><p class="small">연애 상황 카드에서 선택한 상황에 체크되어 있습니다.${selected===undefined?' 아직 선택하지 않았습니다. 아래 버튼으로 돌아가 선택할 수 있어요.':''}</p>${SITUATIONS.map((t,i)=>`<label class="choice"><input type="checkbox" disabled ${selected===i?'checked':''}><span>${esc(t)}</span></label>`).join('')}${btn('chooseSituation','상황 선택 화면으로','secondary')}`;app.querySelector('.panel>p').after(box);el('chooseSituation').onclick=()=>{s.activity=1;activity();};}
};
function playState(){const s=STATES[2];s.play??={type:null,step:0,notes:{},completed:[]};return s.play;}
function scriptHtml(lines){return `<div class="dialogue">${lines.map(([who,line])=>`<div class="dialogue-line"><b>${who}</b><p>${esc(line)}</p></div>`).join('')}</div>`;}
function roleOverview(){return `<h2>연극하기</h2><p>어려웠던 감정과 욕구를 말해보는 연습을 해본다.</p><h3>연극 활동 구조</h3><ol class="role-outline">${ROLE_STEPS.map(([t,d])=>`<li><b>${esc(t)}</b><p>${esc(d)}</p></li>`).join('')}</ol><p class="small">A는 선택한 유형의 역할, B는 상대 연인의 역할입니다. 자료의 예시 반응을 연기하고, 자신의 말로 바꾸어 연습합니다.</p>`;}
function roleContent(t,step,forPrint=false){const r=ROLEPLAYS[t],p=playState();const note=p.notes[t]||'';return `<span class="badge">${r.name} · ${step}단계</span><h2>${ROLE_STEPS[step-1][0]}</h2><p>${ROLE_STEPS[step-1][1]}</p><div class="callout"><b>상황</b><p>${esc(r.situation)}</p></div>${step===1?scriptHtml(r.first):step===2?`<div class="notice"><h3>잠깐 멈추고 함께 생각해 보기</h3><p>${esc(r.pause)}</p></div>`:step===3?scriptHtml(r.second)+(r.lesson?`<p class="notice">${esc(r.lesson)}</p>`:''):`<h3>내 대사를 만들어 보는 문장 틀</h3><p class="notice">${esc(ROLE_TEMPLATE)}</p><h3>상대 역할의 응답 예시</h3><p class="notice">${esc(ROLE_REPLY)}</p><div class="field"><label for="roleNote">상대방에게 하고 싶은 말을 나의 언어로 적어 보세요.</label>${forPrint?`<div class="report-answer">${esc(note||'(작성하지 않음)')}</div>`:`<textarea id="roleNote" placeholder="나의 말과 경험에 맞게 바꾸어 보세요.">${esc(note)}</textarea><div class="print-answer">${esc(note||'(작성하지 않음)')}</div>`}</div>`}`;}
function roleplay(){screen='activity';const p=playState();if(p.type===null){setView(`${steps(2)}<div class="reminder">${esc(reminder())}</div><section class="panel">${roleOverview()}<h3>내가 연습할 유형을 선택하세요.</h3><p class="small">검사 결과는 ${ATTACHMENT_DESCRIPTIONS[calculate(2).typeIndex].name}(임시 참고 분류)입니다. 연습할 유형은 직접 선택할 수 있습니다.</p><div class="type-picker">${ROLEPLAYS.map((r,i)=>`<button class="secondary" data-role="${i}">${r.name}</button>`).join('')}</div><div class="actions">${btn('prevRole','← 감정·생각·행동 분석하기','quiet')}${btn('roleResult','결과 다시 보기','quiet')}</div>${source()}</section>`);app.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{p.type=Number(b.dataset.role);p.step=1;roleplay();});el('prevRole').onclick=()=>{STATES[2].activity=1;activity();};el('roleResult').onclick=result;return;}
 if(p.step===5){setView(`${steps(2)}<section class="panel"><span class="badge">${ROLEPLAYS[p.type].name} 연습 마무리</span><h2>다른 유형도 연습해 볼까요?</h2><p>선택한 유형의 1~4단계 연습을 마쳤습니다. 작성한 대사는 유형별로 유지됩니다.</p><div class="actions">${btn('anotherRole','다른 유형 골라 다시 연습')}${btn('endRole','끝내기','secondary')}${btn('editRole','작성한 대사 다시 보기','quiet')}</div></section>`);el('anotherRole').onclick=()=>{p.type=null;p.step=0;roleplay();};el('endRole').onclick=()=>{STATES[2].finished=true;finish();};el('editRole').onclick=()=>{p.step=4;roleplay();};return;}
 setView(`${steps(2)}<div class="role-progress" aria-label="연극 단계">${[1,2,3,4].map(i=>`<span ${p.step===i?'aria-current="step" class="active"':''}>${i}단계</span>`).join('')}</div><section class="panel">${roleContent(p.type,p.step)}<div class="actions">${btn('rolePrev',p.step===1?'← 유형 선택':'← 이전 단계','secondary')}${btn('roleNext',p.step===4?'연습 마무리 →':'다음 단계 →')}</div>${source()}</section>`);if(el('roleNote'))el('roleNote').oninput=e=>{p.notes[p.type]=e.target.value;e.target.nextElementSibling.textContent=e.target.value||'(작성하지 않음)';};el('rolePrev').onclick=()=>{if(p.step===1){p.type=null;p.step=0;}else p.step--;roleplay();};el('roleNext').onclick=()=>{if(p.step===4&&!p.completed.includes(p.type))p.completed.push(p.type);p.step++;roleplay();};
}
finish=function(){originalFinish();const actions=app.querySelector('.actions');const b=document.createElement('button');b.id='fullPdf';b.textContent='전체 내용·활동 PDF로 저장';b.onclick=printAll;actions.prepend(b);const n=document.createElement('p');n.className='small';n.textContent='이 주차의 소개, 모든 검사 문항과 응답, 결과, 전체 활동과 작성한 내용을 함께 인쇄합니다. 인쇄 창에서 대상을 ‘PDF로 저장’으로 선택해 주세요.';actions.before(n);};
const originalSummary=summaryText;
summaryText=function(include=false){let text=originalSummary(include);if(include&&week===2){const p=playState();text+='\n\n연극하기 — 작성한 대사';ROLEPLAYS.forEach((r,i)=>{text+=`\n${r.name}\n${p.notes[i]||'(작성하지 않음)'}`;});}return text;};
function cleanReportPanel(){const clone=app.querySelector('.panel').cloneNode(true);clone.querySelectorAll('textarea').forEach(t=>{const d=document.createElement('div');d.className='report-answer';d.textContent=t.value||'(작성하지 않음)';t.replaceWith(d);});clone.querySelectorAll('.print-answer,.actions,button,.activity-index,.status').forEach(x=>x.remove());clone.querySelectorAll('details').forEach(x=>x.open=true);clone.querySelectorAll('input').forEach(x=>{const d=document.createElement('span');d.textContent=['checkbox','radio'].includes(x.type)?(x.checked?'☑ ':'☐ '):(x.value||'________________');x.replaceWith(d);});return clone.innerHTML;}
function buildFullReport(){const saved={screen,activity:STATES[week].activity,scroll:window.scrollY};const w=week,d=DATA[w],s=STATES[w];const parts=[];intro();parts.push(`<section class="report-section"><div class="eyebrow">${w}주차 · 소개</div>${cleanReportPanel()}</section>`);parts.push(`<section class="report-section report-chapter"><h1>검사 문항과 나의 응답</h1><p>${d.labels.map((t,i)=>`${i+1}점: ${esc(t)}`).join(' / ')}</p>${d.questions.map((q,i)=>`<div class="report-question"><b>${i+1}. ${esc(q.text)}</b><p>나의 응답: ${s.responses[i]??'미응답'}${s.responses[i]!==null?'점':''}</p></div>`).join('')}</section>`);result();parts.push(`<section class="report-section report-chapter"><h1>검사 결과</h1>${cleanReportPanel()}</section>`);
 for(let i=0;i<ACTIVITIES[w].length;i++){s.activity=i;if(w===2&&i===2){parts.push(`<section class="report-section">${roleOverview()}</section>`);for(let t=0;t<4;t++)for(let step=1;step<=4;step++)parts.push(`<section class="report-section">${roleContent(t,step,true)}</section>`);}else{activity();parts.push(`<section class="report-section"><div class="eyebrow">활동 ${i+1} / ${ACTIVITIES[w].length}</div>${cleanReportPanel()}</section>`);}}
 s.activity=saved.activity;({finish,intro,result,activity,quiz}[saved.screen]||finish)();window.scrollTo(0,saved.scroll);return `<div class="report-cover"><h1>관계 테스트 · ${w}주차</h1><h2>${esc(d.title)} · ${esc(d.test)}</h2><p>소개 · 검사 응답 · 결과 · 전체 활동 기록</p><p class="small">${esc(d.notice)}</p></div>`+parts.join('');}
function printAll(){el('full-report')?.remove();const report=document.createElement('div');report.id='full-report';report.innerHTML=buildFullReport();document.body.append(report);const title=document.title;document.title=`관계테스트_${week}주차_전체기록`;document.body.classList.add('print-all');const cleanup=()=>{document.body.classList.remove('print-all');document.title=title;report.remove();};window.addEventListener('afterprint',cleanup,{once:true});try{window.print();}catch{cleanup();el('status').textContent='인쇄 창을 열 수 없습니다. 일반 브라우저에서 파일을 열어 다시 시도해 주세요.';}}

const VALUE_CONTENT=["<h3>3주차. 나의 가치 탐색</h3>\n<p><strong>관계에 있어서 나에게 중요한 가치는 무엇일까?</strong></p>\n<h2>사랑하기 전에, 나를 만나다</h2>\n<p>나의 가치관을 통해 발견하는 사랑의 모습</p>\n<p>나는 어떤 태도로 살아가고 싶은 사람일까요? 그리고 사랑하는 관계에서는 무엇을 소중하게 여기고 싶을까요?</p>\n<p>이번 주에는 ‘나의 가치 여정’ 테스트를 통해 나에게 중요한 가치 단어를 선택하고, 그 가치가 나의 삶과 관계에서 어떤 의미를 가지는지 살펴봅니다.</p>\n<p>내가 소중히 여기는 가치는 나의 행동을 이끄는 기준이 되기도 하고, 연인에게 기대하는 기준이 되기도 합니다. 나의 가치를 알아가는 것과 함께, 상대방과의 다름을 어떻게 받아들이고 내 마음을 표현할지도 생각해 봅니다.</p>\n<h3>이번 주에 함께할 활동</h3>\n<p>1. <strong>나의 가치 발견하기</strong>  <br>   가치 여정 테스트를 진행하고, 나에게 중요한 최종 가치 단어 5개를 확인합니다.</p>\n<p>2. <strong>분석을 읽으며 나를 이해하기</strong>  <br>   테스트에서 제공하는 프롬프트로 AI 분석 답변을 받아봅니다. 공감되는 부분과 나와 다르다고 느껴지는 부분을 살펴봅니다.</p>\n<p>3. <strong>나의 가치를 관계에 적용하기</strong>  <br>   내가 중요하게 여기는 가치가 연애에서 어떤 말과 행동, 기대와 갈등으로 나타날 수 있을지 생각합니다.</p>\n<p>4. <strong>나의 사랑 선언문 완성하기</strong>  <br>   지키고 싶은 가치와 돌아볼 부분, 관계에서 실천할 행동을 나의 말로 정리합니다.</p>\n<h3>분석 결과를 읽을 때 기억해 주세요</h3>\n<p>AI의 분석은 나를 이해하기 위한 참고 자료입니다. 나를 정확히 규정하는 정답으로 받아들일 필요는 없습니다.</p>\n<p>“이게 정말 나의 모습인가?”  <br>“내 경험과 맞는 부분은 무엇이고, 다른 부분은 무엇인가?”  <br>“이런 내가 연애를 한다면 어떤 모습일까?”</p>\n<p>이 질문들을 통해 나에게 맞는 의미를 스스로 찾아보세요.</p>", "<h2>나의 가치 여정 시작하기</h2>\n<p>이번 활동은 외부 테스트와 내가 사용하는 생성형 AI를 이용합니다. 아래 순서대로 진행한 뒤, 이 화면으로 돌아와 활동을 이어가 주세요.</p>\n<h3>1. 가치 여정 테스트 진행하기</h3>\n<p>아래 링크를 눌러 ‘나의 가치 여정’ 테스트를 진행하세요. 단어를 고르고 내려놓는 과정을 거쳐, 지금 나에게 중요한 최종 가치 단어 5개를 확인합니다.</p>\n<p><strong><a class=\"value-link\" href=\"https://word-journey.site/\" target=\"_blank\" rel=\"noopener noreferrer\">나의 가치 여정 테스트 열기 ↗</a></strong></p>\n<p>테스트는 새 탭에서 열립니다. 테스트를 마친 뒤 이 화면으로 돌아와 주세요.</p>\n<h3>2. 테스트 결과지 다운로드하기</h3>\n<p>테스트를 마치면 결과지를 다운로드해 보관해 주세요. 이후 활동에서 최종 가치 단어와 원하지 않거나 극복하고 싶은 단어, 그 반대편에서 선택한 열망을 다시 살펴봅니다.</p>\n<h3>3. AI 분석용 프롬프트 복사하기</h3>\n<p>테스트 결과 화면에서 제공하는 <strong>‘AI 분석용 프롬프트’ 전체를 복사</strong>해 주세요.</p>\n<p>가치 단어만 복사하는 것이 아니라, 분석을 요청하는 프롬프트를 함께 복사해야 합니다.</p>\n<h3>4. 내가 사용하는 생성형 AI에 붙여넣기</h3>\n<p>복사한 프롬프트를 내가 사용하는 생성형 AI의 대화창에 붙여넣고 전송하세요. 이후 생성되는 분석 답변을 읽어보세요.</p>\n<p><strong>프롬프트를 복사하는 것만으로 분석이 끝나는 것은 아닙니다. AI에게 전송하고 답변을 받는 과정까지 진행해 주세요.</strong></p>\n<h3>5. AI 분석 답변도 보관하기</h3>\n<p>다음 활동에서는 테스트 결과지와 AI 분석 답변을 함께 참고합니다.</p>\n<p>AI 대화를 다시 열 수 있도록 남겨두거나, 받은 답변을 복사해 따로 보관해 주세요.</p>\n<div class=\"value-table\"><table><thead><tr><th>구분</th><th>무엇인가요?</th><th>어떻게 사용하나요?</th></tr></thead><tbody><tr><td>테스트 결과지</td><td>내가 선택한 가치와 단어를 확인하는 자료</td><td>가치 단어와 선택한 방향을 다시 살펴봅니다.</td></tr><tr><td>프롬프트</td><td>AI에게 분석을 요청하기 위해 보내는 글</td><td>내가 사용하는 생성형 AI에 붙여넣고 전송합니다.</td></tr><tr><td>AI 분석 답변</td><td>AI가 프롬프트를 읽고 작성한 분석 내용</td><td>활동 중 읽으면서 내 경험과 맞는지 검토합니다.</td></tr></tbody></table></div>\n<h3>6. 관계 테스트로 돌아와 참고 자료 붙여넣기</h3>\n<p>테스트 결과지와 AI 분석 답변을 준비했다면 이 화면으로 돌아오세요. 다음 활동에서 편하게 볼 수 있도록 아래에 내용을 붙여넣을 수 있습니다.</p>\n<h4>가치 여정 테스트 결과 — 선택 입력</h4>\n<p><strong>입력란 안내:</strong>  <br>“테스트 결과 내용을 붙여넣어 주세요. 최종 가치 단어와 선택 과정에서 나온 내용을 활동 중 다시 확인할 수 있습니다.”</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-ref-result\">가치 여정 테스트 결과</label><textarea id=\"v-ref-result\" data-v=\"ref-result\" rows=\"4\"></textarea></div>\n<h4>AI 분석 답변 — 선택 입력</h4>\n<p><strong>입력란 안내:</strong>  <br>“프롬프트를 보내고 AI에게 받은 분석 답변을 붙여넣어 주세요. 프롬프트 자체가 아니라, AI가 작성한 답변을 넣는 칸입니다.”</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-ref-ai\">AI 분석 답변</label><textarea id=\"v-ref-ai\" data-v=\"ref-ai\" rows=\"4\"></textarea></div>\n<p>두 칸은 선택 입력입니다. 붙여넣지 않고 결과지와 AI 대화창을 별도로 보면서 활동해도 괜찮습니다.</p>\n<p>붙여넣은 자료는 활동 중 참고하기 위한 것입니다. 앱이 내용을 다시 분석하거나 점수화하지 않습니다. AI 분석에서 공감되는 부분과 나와 다르다고 느껴지는 부분을 구분하며 읽어보세요.</p>\n<p><strong>우리 웹앱에 붙여넣은 내용과 활동 답변은 서버에 저장하지 않습니다. 새로고침하거나 창을 닫으면 사라지므로, 남겨 두고 싶은 기록은 마지막 화면에서 복사하거나 PDF로 저장해 주세요.</strong></p>\n<h3>활동을 시작하기 전에 확인해 주세요</h3>\n<div class=\"value-checks\"><label><input type=\"checkbox\" data-v=\"check-0\"> 테스트를 마치고 결과지를 보관했습니다.</label><label><input type=\"checkbox\" data-v=\"check-1\"> 프롬프트를 생성형 AI에 붙여넣고 분석 답변을 받았습니다.</label><label><input type=\"checkbox\" data-v=\"check-2\"> 다음 활동에서 결과지와 분석 답변을 다시 볼 수 있습니다.</label></div>", "<h3>1장. 내가 소중히 여기는 것</h3>\n<p>가치관 테스트 결과를 확인하고, 내가 중요하게 여기는 삶의 방향을 살펴봅니다.</p>\n<h3>나의 최종 가치 단어 5개를 적어보세요.</h3>\n<div class=\"value-words\"><div class=\"field\"><label class=\"sr-only\" for=\"v-value-0\">가치 1</label><input id=\"v-value-0\" data-v=\"value-0\" type=\"text\"></div><div class=\"field\"><label class=\"sr-only\" for=\"v-value-1\">가치 2</label><input id=\"v-value-1\" data-v=\"value-1\" type=\"text\"></div><div class=\"field\"><label class=\"sr-only\" for=\"v-value-2\">가치 3</label><input id=\"v-value-2\" data-v=\"value-2\" type=\"text\"></div><div class=\"field\"><label class=\"sr-only\" for=\"v-value-3\">가치 4</label><input id=\"v-value-3\" data-v=\"value-3\" type=\"text\"></div><div class=\"field\"><label class=\"sr-only\" for=\"v-value-4\">가치 5</label><input id=\"v-value-4\" data-v=\"value-4\" type=\"text\"></div></div>\n<h3>질문 1. 나는 어떤 태도로 세상을 살아가고 싶은 사람인가?</h3>\n<p>내가 선택한 다섯 단어를 살펴보며, 이 가치들이 나의 삶에서 어떤 의미를 가지는지 생각해 봅시다.</p>\n<p>예: 나는 다른 사람의 마음을 이해하고, 서로의 다름을 존중하며 함께 살아가는 사람이 되고 싶다.</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-a3-0\">질문 1 나의 답변</label><textarea id=\"v-a3-0\" data-v=\"a3-0\" rows=\"4\"></textarea></div>\n<h3>질문 2. 나는 어려움 앞에서 어떤 사람이 되고 싶은가?</h3>\n<p>내가 선택한 부정의 단어와 그 반대편의 열망을 떠올려 봅시다. 어려움과 갈등이 찾아올 때, 나는 어떤 태도를 선택하고 싶은가요?</p>\n<p>예: 나는 좌절하는 순간에도 소망을 잃지 않고, 원망하기보다 감사할 수 있는 사람이 되고 싶다.</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-a3-1\">질문 2 나의 답변</label><textarea id=\"v-a3-1\" data-v=\"a3-1\" rows=\"4\"></textarea></div>", "<h3>2장. 나의 가치가 사랑을 만날 때</h3>\n<p>AI 가치관 분석 답변을 읽고, 나의 가치가 연애 관계에서 어떤 모습으로 나타날 수 있을지 생각해 봅니다.</p>\n<h2>STEP 1. 나를 이해하기</h2>\n<p>AI 분석 답변에서 가장 공감되는 부분과 나와 다르다고 느껴지는 부분을 구분하며 읽어보세요. 분석을 그대로 받아들이기보다, 나의 실제 경험과 맞는지 살펴봅니다.</p>\n<h3>질문 1. 내가 이 가치를 중요하게 여기게 된 이유는 무엇일까?</h3>\n<p>나의 경험, 관계, 기억을 떠올려 보세요. 특별히 이 가치를 소중하게 여기게 된 사건이 있었나요?</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-a4-0\">질문 1 나의 답변</label><textarea id=\"v-a4-0\" data-v=\"a4-0\" rows=\"4\"></textarea></div>\n<h3>질문 2. 이 가치는 평소 나의 말과 행동에서 어떻게 나타나고 있을까?</h3>\n<p>친구나 가족과의 관계에서 이 가치를 실천했던 구체적인 장면을 떠올려 봅시다.</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-a4-1\">질문 2 나의 답변</label><textarea id=\"v-a4-1\" data-v=\"a4-1\" rows=\"4\"></textarea></div>\n<h2>STEP 2. 연애 속의 나 상상하기</h2>\n<h3>질문 3. 내가 연애를 한다면, 이 가치는 어떤 모습으로 나타날까?</h3>\n<p>연인에게 어떤 말과 행동으로 이 가치를 표현하고 싶나요?</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-a4-2\">질문 3 나의 답변</label><textarea id=\"v-a4-2\" data-v=\"a4-2\" rows=\"4\"></textarea></div>\n<h3>질문 4. 나는 연인에게도 이 가치를 기대하고 있지는 않을까?</h3>\n<p>상대방이 나와 같은 가치를 중요하게 여기지 않는다면 나는 어떤 감정을 느낄까요? 서로의 다름을 어떻게 받아들일 수 있을까요?</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-a4-3\">질문 4 나의 답변</label><textarea id=\"v-a4-3\" data-v=\"a4-3\" rows=\"4\"></textarea></div>\n<h3>질문 5. 내가 중요하게 여기는 가치가 오히려 관계에서 나의 약점이 될 수 있을까?</h3>\n<p>예를 들어 공감을 중요하게 여기는 사람이 상대의 감정을 지나치게 배려하다 자신의 감정을 표현하지 못하는 경우를 생각해 볼 수 있습니다.</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-a4-4\">질문 5 나의 답변</label><textarea id=\"v-a4-4\" data-v=\"a4-4\" rows=\"4\"></textarea></div>\n<h2>STEP 3. 갈등 앞에서의 나 발견하기</h2>\n<h3>질문 6. 내가 불편하게 느끼는 태도나 행동을 연인에게서 발견한다면 나는 어떻게 반응할까?</h3>\n<p>가치 여정에서 선택한 부정 단어를 떠올려 보세요. 그 단어와 관련된 태도나 행동이 나에게 특히 불편하게 느껴지는 이유는 무엇일까요?</p>\n<p>부정 단어는 그 사람의 정체성이나 성격 전체를 뜻하지 않습니다. 사람 전체를 평가하기보다, 내가 불편하게 느끼는 구체적인 태도나 행동을 살펴봅니다.</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-a4-5\">질문 6 나의 답변</label><textarea id=\"v-a4-5\" data-v=\"a4-5\" rows=\"4\"></textarea></div>\n<h3>질문 7. 그런 상황에서도 나의 가치와 경계선을 지키면서, 상대방에게 내 마음을 건강하게 표현하려면 어떻게 해야 할까?</h3>\n<p>상대를 존중하면서 실제로 연인에게 건넬 수 있는 말 한 문장을 생각해 봅시다.</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-a4-6\">질문 7 나의 답변</label><textarea id=\"v-a4-6\" data-v=\"a4-6\" rows=\"4\"></textarea></div>", "<h3>3장. 나의 사랑 선언문</h3>\n<p>지금까지 발견한 나의 가치와 약점, 관계에서의 다짐을 바탕으로 나만의 사랑 선언문을 완성해 봅시다.</p>\n<h2>나의 사랑 선언문</h2>\n<p><strong>나는 나를 이해하고, 상대를 존중하며, 건강한 사랑을 준비하겠습니다.</strong></p>\n<h3>1. 내가 지키고 싶은 가치</h3>\n<p>나는 사랑하는 관계에서</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-declaration-0\">내가 지키고 싶은 가치 입력칸</label><textarea id=\"v-declaration-0\" data-v=\"declaration-0\" rows=\"4\"></textarea></div>\n<p>을/를 중요하게 여기겠습니다.</p>\n<h3>2. 나의 약점을 마주하는 태도</h3>\n<p>나는</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-declaration-1\">내가 돌아볼 약점 입력칸</label><textarea id=\"v-declaration-1\" data-v=\"declaration-1\" rows=\"4\"></textarea></div>\n<p>라는 약점이 있을 수 있음을 인정합니다.</p>\n<p>그렇기에 나는</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-declaration-2\">실천할 행동 입력칸</label><textarea id=\"v-declaration-2\" data-v=\"declaration-2\" rows=\"4\"></textarea></div>\n<p>을/를 실천하겠습니다.</p>\n<h3>3. 다름과 갈등을 대하는 태도</h3>\n<p>내가 불편하게 느끼는</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-declaration-3\">구체적인 태도나 행동 입력칸</label><textarea id=\"v-declaration-3\" data-v=\"declaration-3\" rows=\"4\"></textarea></div>\n<p>을/를 마주했을 때,</p>\n<p>나는</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-declaration-4\">상대를 존중하며 나의 가치와 경계선을 지킬 대응 입력칸</label><textarea id=\"v-declaration-4\" data-v=\"declaration-4\" rows=\"4\"></textarea></div>\n<p>으로 대처하겠습니다.</p>\n<h3>4. 마지막 다짐</h3>\n<p>내가 꿈꾸는 사랑은</p>\n<div class=\"field\"><label class=\"sr-only\" for=\"v-declaration-5\">내가 꿈꾸는 사랑 입력칸</label><textarea id=\"v-declaration-5\" data-v=\"declaration-5\" rows=\"4\"></textarea></div>\n<p>입니다.</p>\n<h3>마지막 메시지</h3>\n<p><strong>좋은 사람을 만날 준비는, 내가 어떤 사람인지 알고 나의 가치와 약점을 책임 있게 다루는 것에서 시작됩니다.</strong></p>\n<h3>오늘의 기록 보관하기</h3>\n<ul><li><strong>나의 선언문 복사하기:</strong> 위의 문장 틀과 내가 작성한 내용을 하나의 선언문으로 복사합니다.</li><li><strong>전체 내용·활동 PDF로 저장:</strong> 이번 주차의 소개와 진행 안내, 붙여넣은 테스트 결과와 AI 분석 답변, 활동 질문과 작성한 답변, 완성한 사랑 선언문을 함께 저장합니다.</li></ul>\n<p>새로고침하거나 창을 닫으면 입력 내용이 사라집니다. 남겨 두고 싶은 기록은 먼저 복사하거나 PDF로 저장해 주세요.</p>"];
const valueStyle=document.createElement('style');valueStyle.textContent=`

`;document.head.append(valueStyle);
function valueGet(key){const [kind,i]=key.split('-');if(kind==='ref')return VALUE_STATE.refs[i];if(kind==='value')return VALUE_STATE.values[+i];if(kind==='check')return VALUE_STATE.checks[+i];return VALUE_STATE.answers[key]||'';}
function valuePut(key,val){const [kind,i]=key.split('-');if(kind==='ref')VALUE_STATE.refs[i]=val;else if(kind==='value')VALUE_STATE.values[+i]=val;else if(kind==='check')VALUE_STATE.checks[+i]=val;else VALUE_STATE.answers[key]=val;}
function valueFill(root,bind=false){root.querySelectorAll('[data-v]').forEach(input=>{const key=input.dataset.v;if(input.type==='checkbox')input.checked=!!valueGet(key);else input.value=valueGet(key);if(bind)input.addEventListener('input',()=>valuePut(key,input.type==='checkbox'?input.checked:input.value));});}
function valueReference(){return `<details class="value-reference"><summary>나의 결과 펼쳐보기</summary><h3>가치 여정 테스트 결과</h3><div class="value-reference-text">${esc(VALUE_STATE.refs.result||'아직 붙여넣은 테스트 결과가 없습니다.')}</div><h3>AI 분석 답변</h3><div class="value-reference-text">${esc(VALUE_STATE.refs.ai||'아직 붙여넣은 AI 분석 답변이 없습니다.')}</div><div class="actions">${btn('valueEditRefs','참고 자료 입력·수정하기','quiet')}</div></details>`;}
function valuePage(n=0){week=3;screen='values';VALUE_STATE.page=n;VALUE_STATE.visited=true;const next=['가치 여정 진행 방법 보기 →','준비했어요. 나의 가치 탐색 이어가기 →','나의 가치가 사랑을 만날 때 →','나의 사랑 선언문 만들기 →'];const prev=['','← 소개로','← 테스트 진행 안내로','← 내가 소중히 여기는 것으로','← 나의 가치가 사랑을 만날 때로'];setView(`<div class="eyebrow">3주차 · 나의 가치 탐색</div><nav class="value-progress" aria-label="진행 단계">${['소개','테스트 안내','가치 발견','관계 탐색','선언문'].map((s,i)=>`<span ${n===i?'aria-current="step"':''}>${i+1}. ${s}</span>`).join('')}</nav><section class="panel value-panel">${n>=2?valueReference():''}${VALUE_CONTENT[n]}${n===4?`<div class="actions">${btn('valueCopy','나의 선언문 복사하기')}${btn('valuePdf','전체 내용·활동 PDF로 저장','secondary')}</div><p class="small">인쇄 창에서 대상을 ‘PDF로 저장’으로 선택해 주세요.</p>`:''}<div class="actions">${n>0?btn('valuePrev',prev[n],'quiet'):''}${n<4?btn('valueNext',next[n]):btn('valueHome','전체 주차로','secondary')}</div></section>`);valueFill(app,true);if(el('valueNext'))el('valueNext').onclick=()=>valuePage(n+1);if(el('valuePrev'))el('valuePrev').onclick=()=>valuePage(n-1);if(el('valueEditRefs'))el('valueEditRefs').onclick=()=>valuePage(1);if(n===4){el('valueHome').onclick=home;el('valueCopy').onclick=()=>copyText(valueDeclaration());el('valuePdf').onclick=valuePrintAll;}}
function valueDeclaration(){const a=i=>VALUE_STATE.answers['declaration-'+i]||'________________';return `나의 사랑 선언문\n\n나는 나를 이해하고, 상대를 존중하며, 건강한 사랑을 준비하겠습니다.\n\n1. 내가 지키고 싶은 가치\n나는 사랑하는 관계에서 ${a(0)} 을/를 중요하게 여기겠습니다.\n\n2. 나의 약점을 마주하는 태도\n나는 ${a(1)} 라는 약점이 있을 수 있음을 인정합니다.\n그렇기에 나는 ${a(2)} 을/를 실천하겠습니다.\n\n3. 다름과 갈등을 대하는 태도\n내가 불편하게 느끼는 ${a(3)} 을/를 마주했을 때, 나는 ${a(4)} 으로 대처하겠습니다.\n\n4. 마지막 다짐\n내가 꿈꾸는 사랑은 ${a(5)} 입니다.`;}
function valueFullReport(){return '<div class="report-cover"><h1>3주차. 나의 가치 탐색</h1><h2>사랑하기 전에, 나를 만나다</h2><p>소개 · 진행 안내 · 참고 자료 · 전체 활동 기록 · 나의 사랑 선언문</p></div>'+VALUE_CONTENT.map((html,i)=>{const part=document.createElement('section');part.className='report-section value-panel';part.innerHTML=html;valueFill(part);part.querySelectorAll('input,textarea').forEach(input=>{const d=document.createElement('div');d.className='report-answer';d.textContent=input.type==='checkbox'?(input.checked?'☑':'☐'):(input.value||'(작성하지 않음)');input.replaceWith(d);});return part.outerHTML;}).join('');}
function valuePrintAll(){el('full-report')?.remove();const root=document.createElement('div');root.id='full-report';root.innerHTML=valueFullReport();document.body.append(root);const oldTitle=document.title;document.title='관계테스트_3주차_나의가치탐색_전체기록';document.body.classList.add('print-all');const cleanup=()=>{document.body.classList.remove('print-all');document.title=oldTitle;root.remove();};window.addEventListener('afterprint',cleanup,{once:true});try{window.print();}catch{cleanup();el('status').textContent='인쇄 창을 열 수 없습니다. 일반 브라우저에서 파일을 열어 다시 시도해 주세요.';}}
window.__programTest.valueState=VALUE_STATE;window.__programTest.valueFullReport=valueFullReport;window.__programTest.valueDeclaration=valueDeclaration;
